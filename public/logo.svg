<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="goldCircleBg" cx="35%" cy="32%" r="68%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FFF736" />
      <stop offset="28%" stop-color="#FFCE00" />
      <stop offset="68%" stop-color="#FF9B00" />
      <stop offset="100%" stop-color="#E27400" />
    </radialGradient>

    <!-- White Monogram Sheen -->
    <linearGradient id="whiteSheen" x1="100" y1="90" x2="360" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF2F7" />
    </linearGradient>

    <!-- Top Ribbon 3D Flap Gradient -->
    <linearGradient id="topFlapGrad" x1="345" y1="110" x2="430" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD200" />
      <stop offset="45%" stop-color="#FFA400" />
      <stop offset="100%" stop-color="#D65800" />
    </linearGradient>

    <!-- Mid Ribbon 3D Flap Gradient -->
    <linearGradient id="midFlapGrad" x1="320" y1="220" x2="390" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAA00" />
      <stop offset="70%" stop-color="#E57200" />
      <stop offset="100%" stop-color="#B84500" />
    </linearGradient>

    <!-- Bottom Ribbon 3D Flap Gradient -->
    <linearGradient id="botFlapGrad" x1="345" y1="310" x2="430" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFCA00" />
      <stop offset="55%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#C94D00" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="circleGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#FF9000" flood-opacity="0.32" />
    </filter>

    <filter id="emblemShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="10" stdDeviation="9" flood-color="#6B3300" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Golden Yellow Background Circle -->
  <circle cx="210" cy="250" r="185" fill="url(#goldCircleBg)" filter="url(#circleGlow)" />

  <!-- Monogram & 3D Ribbon Group -->
  <g filter="url(#emblemShadow)">

    <!-- Top Ribbon Shadow Fold -->
    <path d="M 345 190 L 420 160 L 395 205 Z" fill="#8C3500" opacity="0.9" />

    <!-- Top Ribbon 3D Folded Flap (Angles Up-Right) -->
    <polygon points="345,135 430,105 420,160 345,190" fill="url(#topFlapGrad)" stroke="#FFEAA0" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Middle Ribbon 3D Extension Flap -->
    <polygon points="320,223 390,235 380,287 320,277" fill="url(#midFlapGrad)" stroke="#FFD870" stroke-width="1" stroke-linejoin="round" />

    <!-- Bottom Ribbon Shadow Fold -->
    <path d="M 345 310 L 420 340 L 395 295 Z" fill="#8C3500" opacity="0.85" />

    <!-- Bottom Ribbon 3D Folded Flap (Angles Down-Right) -->
    <polygon points="345,310 420,340 430,395 345,365" fill="url(#botFlapGrad)" stroke="#FFE580" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Main White Emblem Structure -->
    <path d="
      M 345,135
      L 225,135
      A 115,115 0 0,0 110,250
      A 115,115 0 0,0 225,365
      L 345,365
      L 345,310
      L 235,310
      A 60,60 0 0,1 175,250
      A 60,60 0 0,1 235,190
      L 345,190
      Z
      
      M 205,223
      L 320,223
      L 320,277
      L 205,277
      Z
    " fill="url(#whiteSheen)" fill-rule="evenodd" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />

    <!-- High-Gloss White Edge Accents -->
    <path d="M 345,135 L 225,135 A 115,115 0 0,0 110,250" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  </g>
</svg>
